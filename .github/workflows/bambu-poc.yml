# Bambu Studio proof-of-concept — ISOLATED EXPERIMENT.
#
# This workflow is NOT part of the production pipeline. The production worker
# keeps using PrusaSlicer (see slice.yml). Restore point for the known-good
# PrusaSlicer implementation: git tag/branch `prusa-a1-known-good`.
#
# Purpose: validate whether pinned Bambu Studio can run headlessly on GitHub
# Actions ubuntu-latest and reproduce the Bambu Studio GUI reference result.
#
# Pinned version: Bambu Studio v02.08.02.61 (same version that authored the
# reference 3MF project). No dynamic "latest" downloads.

name: Bambu Studio POC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BS_VERSION: v02.08.02.61
  BS_APPIMAGE_URL: https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage
  # Official profiles at the same pinned tag:
  BS_MACHINE_JSON: https://raw.githubusercontent.com/bambulab/BambuStudio/v02.08.02.61/resources/profiles/BBL/machine/Bambu%20Lab%20A1%200.4%20nozzle.json
  BS_PROCESS_JSON: https://raw.githubusercontent.com/bambulab/BambuStudio/v02.08.02.61/resources/profiles/BBL/process/0.20mm%20Standard%20%40BBL%20A1.json
  BS_FILAMENT_JSON: https://raw.githubusercontent.com/bambulab/BambuStudio/v02.08.02.61/resources/profiles/BBL/filament/Generic%20PLA%20%40BBL%20A1.json

jobs:
  poc:
    name: Headless Bambu Studio validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libgtk-3-0 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libx11-xcb1 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-0 || true

      - name: Download pinned Bambu Studio AppImage
        run: |
          curl -fL --retry 3 -o /tmp/bs.AppImage "$BS_APPIMAGE_URL"
          chmod +x /tmp/bs.AppImage
          (cd /tmp && ./bs.AppImage --appimage-extract > /dev/null)
          ls /tmp/squashfs-root | head -20
          sudo ln -sf /tmp/squashfs-root/AppRun /usr/local/bin/bambu-studio

      - name: POC 1 — headless startup (--help)
        id: help
        continue-on-error: true
        run: |
          set +e
          bambu-studio --help > poc-help.log 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          head -15 poc-help.log
          exit $RC

      - name: POC 2 — slice reference 3MF with embedded A1 project settings
        id: slice3mf
        continue-on-error: true
        run: |
          set +e
          bambu-studio \
            --slice 0 \
            --debug 2 \
            --export-3mf poc-chibi.gcode.3mf \
            test-fixtures/chibi-roger-federer-elegant-backhand-tennis.3mf \
            > poc-slice-3mf.log 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          tail -25 poc-slice-3mf.log
          exit $RC

      - name: Extract results from sliced 3MF
        if: steps.slice3mf.outputs.exit_code == '0'
        run: |
          mkdir -p poc-out && cd poc-out
          unzip -o ../poc-chibi.gcode.3mf > /dev/null
          echo "--- archive contents ---"
          find . -type f | sort
          echo "--- plate json ---"
          cat Metadata/plate_1.json || true
          echo ""
          echo "--- slice_info ---"
          cat Metadata/slice_info.config || true
          for f in Metadata/slice_info*; do [ -f "$f" ] && echo "--- $f ---" && cat "$f"; done
          GCODE=$(find . -name '*.gcode' | head -1)
          echo "--- gcode size ---"
          ls -la "$GCODE"
          echo "--- unanchored footer search ---"
          grep -aiE '(filament used|filament weight|printing time|estimat)' "$GCODE" | tail -25 || true

      - name: Download official A1 profile JSONs at pinned tag
        if: always()
        run: |
          mkdir -p bs-profiles
          curl -fSL --retry 3 -o bs-profiles/machine.json  "$BS_MACHINE_JSON"
          curl -fSL --retry 3 -o bs-profiles/process.json  "$BS_PROCESS_JSON"
          curl -fSL --retry 3 -o bs-profiles/filament.json "$BS_FILAMENT_JSON"
          ls -la bs-profiles

      - name: POC 3 — slice STL with forced A1/PLA settings
        id: slicestl
        continue-on-error: true
        run: |
          set +e
          bambu-studio \
            --slice 0 \
            --debug 2 \
            --load-settings "bs-profiles/machine.json;bs-profiles/process.json" \
            --load-filaments "bs-profiles/filament.json" \
            --export-3mf poc-chibi-stl.gcode.3mf \
            test-fixtures/chibi-roger-federer-elegant-backhand-tennis.stl \
            > poc-slice-stl.log 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          tail -25 poc-slice-stl.log
          exit $RC

      - name: Extract results from STL slice
        if: steps.slicestl.outputs.exit_code == '0'
        run: |
          mkdir -p poc-out-stl && cd poc-out-stl
          unzip -o ../poc-chibi-stl.gcode.3mf > /dev/null
          cat Metadata/plate_1.json || true
          for f in Metadata/slice_info*; do [ -f "$f" ] && echo "--- $f ---" && cat "$f"; done
          GCODE=$(find . -name '*.gcode' | head -1)
          ls -la "$GCODE"
          grep -aiE '(filament used|filament weight|printing time|estimat)' "$GCODE" | tail -25 || true

      - name: POC 4 — repeat-run stability (3 identical slices of the STL)
        if: always()
        run: |
          set +e
          OVERALL=0
          for i in 1 2 3; do
            bambu-studio --slice 0 --load-settings "bs-profiles/machine.json;bs-profiles/process.json" --load-filaments "bs-profiles/filament.json" --export-3mf "poc-repeat-$i.gcode.3mf" test-fixtures/chibi-roger-federer-elegant-backhand-tennis.stl > "poc-repeat-$i.log" 2>&1
            RC=$?
            echo "--- run $i (slice exit $RC) ---"
            if [ $RC -ne 0 ]; then OVERALL=1; tail -8 "poc-repeat-$i.log"; continue; fi
            rm -rf "r$i"; mkdir -p "r$i"
            (cd "r$i" && unzip -o "../poc-repeat-$i.gcode.3mf" > /dev/null)
            PRED=$(grep -o 'key="prediction" value="[0-9]*"' "r$i/Metadata/slice_info.config" | grep -o '[0-9]*')
            WGT=$(grep -o 'key="weight" value="[0-9.]*"' "r$i/Metadata/slice_info.config" | grep -o '[0-9.]*')
            echo "run $i: prediction=${PRED}s weight=${WGT}g"
          done
          echo "repeat_overall=$OVERALL"
          exit $OVERALL

      - name: POC 5 — STL with FULL resolved A1 configuration (from reference project)
        if: always()
        run: |
          set +e
          CFG=test-fixtures/krb-a1-full-config.json
          ls -la "$CFG"
          echo "### variant 5a: single slot ###"
          bambu-studio --slice 0 --debug 1 --load-settings "$CFG" --export-3mf poc-stl-full.gcode.3mf test-fixtures/chibi-roger-federer-elegant-backhand-tennis.stl > poc-stl-full.log 2>&1
          RC5A=$?
          echo "5a exit=$RC5A"
          if [ $RC5A -eq 0 ]; then
            rm -rf full5a && mkdir full5a && (cd full5a && unzip -o ../poc-stl-full.gcode.3mf > /dev/null)
            grep -o 'key="prediction" value="[0-9]*"' full5a/Metadata/slice_info.config || true
            grep -o 'key="weight" value="[0-9.]*"' full5a/Metadata/slice_info.config || true
            grep -o 'used_for_support="[a-z]*"' full5a/Metadata/slice_info.config || true
            G=$(find full5a -name '*.gcode' | head -1)
            for pat in '^; support_type = ' '^; enable_support = ' '^; nozzle_temperature' '^; hot_plate_temp' '^; curr_bed_type' '^; layer_height = '; do
              grep -E "$pat" "$G" | head -2 || true
            done
            echo "support marker count:"; grep -c ';TYPE:Support material' "$G" || true
          fi
          echo "### variant 5b: dual slot (same full config) ###"
          bambu-studio --slice 0 --debug 1 --load-settings "$CFG;$CFG" --export-3mf poc-stl-fullb.gcode.3mf test-fixtures/chibi-roger-federer-elegant-backhand-tennis.stl > poc-stl-fullb.log 2>&1
          RC5B=$?
          echo "5b exit=$RC5B"
          if [ $RC5B -eq 0 ]; then
            rm -rf full5b && mkdir full5b && (cd full5b && unzip -o ../poc-stl-fullb.gcode.3mf > /dev/null)
            grep -o 'key="prediction" value="[0-9]*"' full5b/Metadata/slice_info.config || true
            grep -o 'key="weight" value="[0-9.]*"' full5b/Metadata/slice_info.config || true
            grep -o 'used_for_support="[a-z]*"' full5b/Metadata/slice_info.config || true
            G=$(find full5b -name '*.gcode' | head -1)
            for pat in '^; support_type = ' '^; curr_bed_type' '^; layer_height = '; do
              grep -E "$pat" "$G" | head -2 || true
            done
            echo "support marker count:"; grep -c ';TYPE:Support material' "$G" || true
          fi

      - name: Support material measurement (;TYPE markers)
        if: always()
        run: |
          for d in full5a full5b poc-out; do
            G=$(find $d -name '*.gcode' 2>/dev/null | head -1)
            [ -z "$GCODE$G" ] && continue
            [ -z "$G" ] && continue
            echo "--- support breakdown for $G ---"
            node -e "
const fs=require('fs');
const lines=fs.readFileSync(process.argv[1],'utf8').split('\n');
let type='(none)',lastE=null;const vol={};const AREA=Math.PI*(1.75/2)**2;
for(const l of lines){const m=l.match(/^;TYPE:(.+)$/);if(m){type=m[1].trim();continue;}
const e=l.match(/^G1 .* E([-0-9.]+)/);if(e){const v=parseFloat(e[1]);if(lastE!==null&&v>lastE){vol[type]=(vol[type]||0)+(v-lastE);}lastE=v;}}
let sup=0,tot=0;for(const[k,len]of Object.entries(vol)){const c=len*AREA/1000;tot+=c;if(/Support/.test(k))sup+=c;}
console.log('support cm3:',sup.toFixed(2),'total cm3:',tot.toFixed(2),'grams@1.24:',(tot*1.24).toFixed(2));
" "$G"
          done

      - name: Upload all POC artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bambu-poc-logs
          path: |
            poc-*.log
            poc-help.log
            *.gcode.3mf
          retention-days: 7

      - name: POC summary gate
        if: always()
        run: |
          echo "help   exit: ${{ steps.help.outputs.exit_code }}"
          echo "3mf    exit: ${{ steps.slice3mf.outputs.exit_code }}"
          echo "stl    exit: ${{ steps.slicestl.outputs.exit_code }}"
