# Bambu Studio proof-of-concept — ISOLATED EXPERIMENT.
#
# This workflow is NOT part of the production pipeline. The production worker
# keeps using PrusaSlicer (see slice.yml). Restore point for the known-good
# PrusaSlicer implementation: git tag/branch `prusa-a1-known-good`.
#
# Operational hardening in this revision:
#   - AppImage cached by exact version key, verified before use, re-fetched on
#     corruption; never resolves "latest".
#   - Multi-STL matrix over the proven full-config STL route.
#   - Failure battery: garbage/empty STL, missing config must fail cleanly.
#   - Repeatability: same STL sliced twice, results compared.
#   - Results read exclusively from slice_info.config (prediction/weight/
#     used_for_support) matching src/bambu-poc-result.ts semantics.

name: Bambu Studio POC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BS_VERSION: v02.08.02.61
  BS_CACHE_KEY: bambu-studio-v02.08.02.61-ubuntu24.04-x64
  BS_APPIMAGE_URL: https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage
  BS_HOME: /home/runner/bambu-studio

jobs:
  poc:
    name: Headless Bambu Studio validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libgtk-3-0 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libx11-xcb1 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-0 || true

      - name: Cache pinned Bambu Studio AppImage
        id: bs_cache
        uses: actions/cache@v4
        with:
          path: /home/runner/bambu-studio
          key: bambu-studio-v02.08.02.61-ubuntu24.04-x64

      - name: Download pinned Bambu Studio (cache miss only)
        if: steps.bs_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BS_HOME"
          curl -fL --retry 3 -o "$BS_HOME/bs.AppImage" "$BS_APPIMAGE_URL"
          chmod +x "$BS_HOME/bs.AppImage"
          (cd "$BS_HOME" && ./bs.AppImage --appimage-extract > /dev/null)

      - name: Verify cached Bambu Studio (repair on corruption)
        run: |
          set +e
          OK=1
          [ -f "$BS_HOME/bs.AppImage" ] || OK=0
          [ -x "$BS_HOME/squashfs-root/AppRun" ] || OK=0
          if [ "$OK" = "1" ]; then
            sudo ln -sf "$BS_HOME/squashfs-root/AppRun" /usr/local/bin/bambu-studio
            bambu-studio --help > /dev/null 2>&1 || OK=0
          fi
          if [ "$OK" != "1" ]; then
            echo "::warning::Bambu cache missing or corrupt — re-downloading pinned $BS_VERSION"
            rm -rf "$BS_HOME"
            mkdir -p "$BS_HOME"
            curl -fL --retry 3 -o "$BS_HOME/bs.AppImage" "$BS_APPIMAGE_URL" || exit 1
            chmod +x "$BS_HOME/bs.AppImage"
            (cd "$BS_HOME" && ./bs.AppImage --appimage-extract > /dev/null) || exit 1
            sudo ln -sf "$BS_HOME/squashfs-root/AppRun" /usr/local/bin/bambu-studio
            bambu-studio --help > /dev/null 2>&1 || { echo "::error::re-downloaded Bambu still broken"; exit 1; }
          fi
          echo "verified pinned Bambu Studio $BS_VERSION"

      - name: POC 1 — headless startup (--help)
        id: poc_help
        continue-on-error: true
        run: |
          set +e
          bambu-studio --help > poc-help.log 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          head -5 poc-help.log
          exit $RC

      - name: POC 2 — slice reference 3MF with embedded A1 project settings
        id: poc_3mf
        continue-on-error: true
        run: |
          set +e
          bambu-studio --slice 0 --debug 2 --export-3mf poc-chibi.gcode.3mf test-fixtures/chibi-roger-federer-elegant-backhand-tennis.3mf > poc-slice-3mf.log 2>&1
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          tail -8 poc-slice-3mf.log
          exit $RC

      - name: POC 3 — extract 3MF-route results (slice_info)
        if: steps.poc_3mf.outputs.exit_code == '0'
        run: |
          mkdir -p poc-out && cd poc-out
          unzip -o ../poc-chibi.gcode.3mf > /dev/null
          cat Metadata/slice_info.config | grep -E 'prediction|weight|used_for_support'

      - name: POC 4 — repeatability (same STL twice, full config)
        id: poc_repeat
        run: |
          set +e
          ARGS=(--slice 0 --load-settings "test-fixtures/krb-a1-machine.json;test-fixtures/krb-a1-process.json" --load-filaments "test-fixtures/krb-a1-filament.json")
          FIX=test-fixtures/chibi-roger-federer-elegant-backhand-tennis.stl
          declare -A T; declare -A W; declare -A S
          for i in 1 2; do
            bambu-studio "${ARGS[@]}" --export-3mf "poc-rep-$i.gcode.3mf" "$FIX" > "poc-rep-$i.log" 2>&1
            RC=$?
            echo "run $i exit=$RC"
            [ $RC -ne 0 ] && { tail -10 "poc-rep-$i.log"; exit 1; }
            rm -rf "rep$i" && mkdir "rep$i" && (cd "rep$i" && unzip -o "../poc-rep-$i.gcode.3mf" > /dev/null)
            SI="rep$i/Metadata/slice_info.config"
            T[$i]=$(grep -o 'key="prediction" value="[0-9]*"' "$SI" | grep -o '[0-9]*')
            W[$i]=$(grep -o 'key="weight" value="[0-9.]*"' "$SI" | grep -o '[0-9.]*' | head -1)
            S[$i]=$(grep -c 'used_for_support="true"' "$SI")
            echo "run $i: prediction=${T[$i]}s weight=${W[$i]}g supportEntries=${S[$i]}"
          done
          DT=$(( T[1] > T[2] ? T[1]-T[2] : T[2]-T[1] ))
          DW=$(awk -v a="${W[1]}" -v b="${W[2]}" 'BEGIN{d=a-b; if(d<0)d=-d; printf "%.2f", d}')
          echo "deltas: time=${DT}s weight=${DW}g"
          if [ $DT -gt 120 ]; then echo "::error::time not repeatable (${DT}s apart)"; exit 1; fi
          awk -v d="$DW" 'BEGIN{ if (d+0 > 1.0) exit 1 }' || { echo "::error::weight not repeatable (${DW}g apart)"; exit 1; }

      - name: POC 5 — multi-STL matrix with full A1 config
        if: always()
        run: |
          set +e
          for F in chibi-roger-federer-elegant-backhand-tennis krb-cube-20mm krb-l-bracket; do
            START=$SECONDS
            bambu-studio --slice 0 --load-settings "test-fixtures/krb-a1-machine.json;test-fixtures/krb-a1-process.json" --load-filaments "test-fixtures/krb-a1-filament.json" --export-3mf "mx-$F.gcode.3mf" "test-fixtures/$F.stl" > "mx-$F.log" 2>&1
            RC=$?
            ELAPSED=$(( SECONDS - START ))
            if [ $RC -ne 0 ]; then
              echo "| $F | FAILED exit=$RC |"
              tail -8 "mx-$F.log"
              continue
            fi
            rm -rf mxd && mkdir mxd && (cd mxd && unzip -o "../mx-$F.gcode.3mf" > /dev/null)
            SI=mxd/Metadata/slice_info.config
            PRED=$(grep -o 'key="prediction" value="[0-9]*"' "$SI" | grep -o '[0-9]*')
            WGT=$(grep -o 'key="weight" value="[0-9.]*"' "$SI" | grep -o '[0-9.]*' | head -1)
            SUP=$(grep -c 'used_for_support="true"' "$SI")
            GCODE=$(find mxd -name '*.gcode' | head -1)
            GSZ=$(stat -c%s "$GCODE")
            WARN=$(grep -ci 'warn' "mx-$F.log")
            MIN=$(( PRED / 60 ))
            echo "| $F | exit=$RC | ${PRED}s (${MIN}min) | ${WGT}g | supportUsed=$SUP | gcode=${GSZ}B | runtime=${ELAPSED}s | logWarnings=$WARN |"
          done

      - name: POC 6 — failure battery (must fail cleanly, never fake data)
        if: always()
        run: |
          set +e
          printf 'this is definitely not a valid binary STL payload\n' > bad-garbage.stl
          : > bad-empty.stl
          FAILURES=0
          bambu-studio --slice 0 --load-settings "test-fixtures/krb-a1-machine.json;test-fixtures/krb-a1-process.json" --load-filaments "test-fixtures/krb-a1-filament.json" --export-3mf fb-garbage.gcode.3mf bad-garbage.stl > fb-garbage.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then echo "FAIL: garbage STL sliced without error"; FAILURES=$((FAILURES+1)); else echo "PASS: garbage STL rejected (exit $RC)"; fi
          bambu-studio --slice 0 --load-settings "test-fixtures/krb-a1-machine.json;test-fixtures/krb-a1-process.json" --load-filaments "test-fixtures/krb-a1-filament.json" --export-3mf fb-empty.gcode.3mf bad-empty.stl > fb-empty.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then echo "FAIL: empty STL sliced without error"; FAILURES=$((FAILURES+1)); else echo "PASS: empty STL rejected (exit $RC)"; fi
          bambu-studio --slice 0 --load-settings "missing-machine.json;missing-process.json" --load-filaments "missing-filament.json" --export-3mf fb-noconf.gcode.3mf test-fixtures/krb-cube-20mm.stl > fb-noconf.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then echo "FAIL: missing config accepted"; FAILURES=$((FAILURES+1)); else echo "PASS: missing config rejected (exit $RC)"; fi
          for OUT in fb-garbage.gcode.3mf fb-empty.gcode.3mf fb-noconf.gcode.3mf; do
            if [ -f "$OUT" ]; then echo "FAIL: output $OUT exists despite failure"; FAILURES=$((FAILURES+1)); else echo "PASS: no fabricated output ($OUT absent)"; fi
          done
          echo "failure-battery unexpected-successes=$FAILURES"
          exit $FAILURES

      - name: POC 5b — material/quality/advanced combo matrix (values verified in G-code)
        if: always()
        run: |
          set +e
          FAILS=0
          run_combo () {
            node scripts/poc-combo-slice.mjs "$1" test-fixtures/krb-cube-20mm.stl /usr/local/bin/bambu-studio "combo-$2"
            [ $? -ne 0 ] && FAILS=$((FAILS+1))
          }
          run_combo '{"material":"pla","quality":"fast"}' pla-fast
          run_combo '{"material":"petg","quality":"standard"}' petg-std
          run_combo '{"material":"abs","quality":"standard"}' abs-std
          run_combo '{"material":"pla","quality":"standard","layerHeight":0.12}' pla-std-lh012
          run_combo '{"material":"pla","quality":"standard","infill":60}' pla-std-infill60
          run_combo '{"material":"pla","quality":"standard","supports":false}' pla-std-nosup
          echo "combo_failures=$FAILS"
          exit $FAILS

      - name: Upload all POC artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bambu-poc-logs
          path: |
            poc-*.log
            mx-*.log
            fb-*.log
            *.gcode.3mf
          retention-days: 7

      - name: POC summary gate
        if: always()
        run: |
          echo "help   exit: ${{ steps.poc_help.outputs.exit_code }}"
          echo "3mf    exit: ${{ steps.poc_3mf.outputs.exit_code }}"
