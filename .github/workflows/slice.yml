# KRB PrusaSlicer Worker — one-shot slicing job.
#
# Dispatched by the KRB website (GITHUB_SLICER_TOKEN, actions:write) with a
# Firestore `sliceJobs` document ID. The runner is ephemeral: it checks out the
# worker, downloads the model from the private Supabase Storage bucket
# ("custom-prints"), slices it with PrusaSlicer CLI, writes the result back to
# Firestore and exits. No permanent server.
#
# Backends:
#   Firebase — Authentication + Firestore via Admin SDK (job state only)
#   Supabase — private model storage (STL/3MF download)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT   — full Firebase service-account JSON (contents,
#                                not a path); used by the Firebase Admin SDK
#                                for Firestore job access
#   FIREBASE_PROJECT_ID        — Firebase project ID
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_KEY       — Supabase service key (server-side only)
#
# SUPABASE_BUCKET is NOT a secret — it is passed as a plain value
# (default: custom-prints).

name: Slice Job

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Firestore sliceJobs document ID to process"
        required: true
        type: string

permissions:
  contents: read

env:
  PRUSASLICER_VERSION: "2.9.6"

jobs:
  slice:
    name: Slice model (PrusaSlicer headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # Defense in depth: never let an unvalidated jobId reach a shell or the
      # filesystem (the worker joins TEMP_DIR + jobId). The value is passed to
      # every step via env, never interpolated into shell commands.
      - name: Validate jobId
        env:
          JOB_ID: ${{ inputs.jobId }}
        run: |
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9._-]{1,150}$ ]] || [[ "$JOB_ID" == *".."* ]]; then
            echo "::error::jobId contains unsupported characters"
            exit 1
          fi

      # Community AppImage build (Prusa stopped shipping official Linux
      # AppImages after 2.8.1). Extracted with --appimage-extract so no FUSE is
      # needed on the runner. Cached between runs.
      - name: Cache PrusaSlicer
        id: prusaslicer_cache
        uses: actions/cache@v4
        with:
          path: ~/prusaslicer-appimage
          key: prusaslicer-${{ env.PRUSASLICER_VERSION }}-x86_64

      - name: Install PrusaSlicer runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libfontconfig1 libxrender1 \
            libdbus-1-3 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-shape0 || true

      # PrusaSlicer aborts at startup ("locale::facet::_S_create_c_locale
      # name not valid") unless a UTF-8 locale it can initialize exists;
      # the runner default is not enough for this build. Generate
      # en_US.UTF-8 explicitly and export it for every later step.
      - name: Generate UTF-8 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          echo "--- available locales ---"
          locale -a || true
          if ! locale -a 2>/dev/null | grep -qi '^en_US\.utf8$'; then
            echo "::error::en_US.utf8 not present after locale-gen"
            exit 1
          fi
          {
            echo "LANG=en_US.UTF-8"
            echo "LC_ALL=en_US.UTF-8"
          } >> "$GITHUB_ENV"

      - name: Download and extract PrusaSlicer
        if: steps.prusaslicer_cache.outputs.cache-hit != 'true'
        env:
          PRUSASLICER_URL: https://github.com/gneiss15/PrusaSlicer.AppImage/releases/download/${{ env.PRUSASLICER_VERSION }}/PrusaSlicer-${{ env.PRUSASLICER_VERSION }}-x86_64_GN.AppImage
        run: |
          rm -rf "$HOME/prusaslicer-appimage"
          mkdir -p "$HOME/prusaslicer-appimage"
          curl -fL --retry 3 -o /tmp/prusaslicer.AppImage "$PRUSASLICER_URL"
          chmod +x /tmp/prusaslicer.AppImage
          (cd "$HOME/prusaslicer-appimage" && "/tmp/prusaslicer.AppImage" --appimage-extract > /dev/null)
          rm -f /tmp/prusaslicer.AppImage

      # TEMPORARY DIAGNOSTIC ROUND (locale en_US.utf8 is confirmed present,
      # yet PrusaSlicer still fails with "locale::facet::..."). This run
      # isolates whether the failure comes from the forced LD_LIBRARY_PATH
      # (bundled glibc/libstdc++ shadowing the system runtime) or from the
      # sharun launcher environment. Tests A-D vary LD_LIBRARY_PATH; test E
      # exercises the AppRun launcher. All output is captured. The job
      # intentionally does NOT proceed to the worker: no permanent fix is
      # applied until the root cause is established.
      - name: Expose PrusaSlicer on PATH
        run: |
          ROOT="$HOME/prusaslicer-appimage/squashfs-root"
          BIN="$ROOT/shared/bin/prusa-slicer"
          if [ ! -d "$ROOT" ]; then
            echo "::error::Extraction directory not found: $ROOT"
            ls -la "$HOME/prusaslicer-appimage" || true
            exit 1
          fi
          if [ ! -x "$BIN" ]; then
            echo "::error::PrusaSlicer executable not found or not executable: $BIN"
            find "$ROOT" \( -type f -o -type l \) -name 'prusa-slicer*' -exec ls -ld {} + 2>/dev/null || true
            exit 1
          fi

          run_sep() {
            local LABEL="$1"; shift
            echo "============================================================"
            echo "--- TEST [$LABEL]: $* ---"
            set +e
            "$@" > /tmp/diag-out.txt 2> /tmp/diag-err.txt
            RC=$?
            set -e
            echo "exit code: $RC"
            echo "----- stdout -----"
            cat /tmp/diag-out.txt
            echo "----- stderr -----"
            cat /tmp/diag-err.txt
            echo "----- end [$LABEL] -----"
          }

          echo "############################################################"
          echo "# TESTS A-E: LD_LIBRARY_PATH VARIANTS + LAUNCHER"
          echo "############################################################"
          run_sep A-no-LD_LIBRARY_PATH \
            env APPDIR="$ROOT" LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
                "$BIN" --help
          A_RC=$RC
          run_sep B-LD-shared-lib-only \
            env APPDIR="$ROOT" LD_LIBRARY_PATH="$ROOT/shared/lib" \
                LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 "$BIN" --help
          B_RC=$RC
          run_sep C-LD-lib-only \
            env APPDIR="$ROOT" LD_LIBRARY_PATH="$ROOT/lib" \
                LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 "$BIN" --help
          C_RC=$RC
          run_sep D-LD-lib-plus-shared-lib \
            env APPDIR="$ROOT" LD_LIBRARY_PATH="$ROOT/lib:$ROOT/shared/lib" \
                LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 "$BIN" --help
          D_RC=$RC
          if [ -e "$ROOT/AppRun" ]; then
            run_sep E-AppRun-launcher "$ROOT/AppRun" --help
            E_RC=$RC
          else
            echo "(AppRun absent; test E skipped)"
            E_RC=-1
          fi

          echo "############################################################"
          echo "# BUNDLED RUNTIME / LIBRARY INSPECTION"
          echo "############################################################"
          echo "--- shared/lib: libstdc++ / libc ---"
          ls -l "$ROOT/shared/lib/"libstdc++* 2>/dev/null || echo "(no libstdc++* in shared/lib)"
          ls -l "$ROOT/shared/lib/"libc.so* 2>/dev/null || echo "(no libc.so* in shared/lib)"
          echo "--- \$ROOT/lib contents ---"
          ls -l "$ROOT/lib" 2>/dev/null | head -60 || echo "(no \$ROOT/lib directory)"
          echo "--- sharun library-path file(s) ---"
          for LP in "$ROOT/shared/lib/lib.path" "$ROOT/lib/lib.path"; do
            if [ -f "$LP" ]; then
              echo "--- $LP ---"
              cat "$LP"
            fi
          done
          echo "--- locale-related files inside the extraction ---"
          find "$ROOT/shared" -maxdepth 3 \( -iname '*locale*' -o -iname 'libstdc++*' -o -iname 'libc.so*' \) 2>/dev/null || true
          ls -ld "$ROOT/share/locale" "$ROOT/usr/share/locale" \
                "$ROOT/shared/share/locale" "$ROOT/shared/lib/locale" 2>/dev/null || true
          find "$ROOT" -maxdepth 5 -name 'locale-archive' 2>/dev/null || true
          echo "--- sharun helpers ---"
          for H in "$ROOT/sharun" "$ROOT/lib4bin" "$ROOT/AppRun"; do
            if [ -e "$H" ]; then ls -l "$H"; file "$H"; else echo "($H absent)"; fi
          done
          echo "--- sharun embedded env hints ---"
          if [ -e "$ROOT/sharun" ]; then
            strings "$ROOT/sharun" 2>/dev/null \
              | grep -iE 'LD_LIBRARY_PATH|LOCPATH|APPDIR|locale' | sort -u | head -20 || true
          fi

          echo "############################################################"
          echo "# RESULT SUMMARY (diagnostic run — job intentionally fails)"
          echo "############################################################"
          echo "A (no LD_LIBRARY_PATH):        exit $A_RC"
          echo "B (LD=shared/lib):             exit $B_RC"
          echo "C (LD=lib):                    exit $C_RC"
          echo "D (LD=lib:shared/lib):         exit $D_RC"
          echo "E (AppRun launcher):           exit $E_RC"
          echo "::error::Diagnostic-only run — permanent fix pending root cause"
          exit 1

      # The worker creates its per-job temp dir inside TEMP_DIR (mkdtemp).
      - name: Prepare temp directory
        run: mkdir -p /tmp/krb-slicer

      # Write the service-account secret to RUNNER_TEMP (auto-cleaned after the
      # job, never logged). The JSON is written verbatim, so multiline
      # private_key values survive exactly as stored.
      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      # One-shot execution: node dist/index.js <jobId> (same entrypoint as the
      # Dockerfile). The worker claims the job atomically in Firestore,
      # downloads the model from private Supabase Storage, slices it, writes
      # results and exits. jobId reaches the process as a quoted argument
      # sourced from the validated JOB_ID env var — no direct shell
      # interpolation of ${{ }}.
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.jobId }}
          SLICER_PATH: prusaslicer
          TEMP_DIR: /tmp/krb-slicer
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: custom-prints
        run: node dist/index.js "$JOB_ID"
