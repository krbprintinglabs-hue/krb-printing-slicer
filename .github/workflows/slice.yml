# KRB PrusaSlicer Worker — one-shot slicing job.
#
# Dispatched by the KRB website (GITHUB_SLICER_TOKEN, actions:write) with a
# Firestore `sliceJobs` document ID. The runner is ephemeral: it checks out the
# worker, downloads the model from the private Supabase Storage bucket
# ("custom-prints"), slices it with PrusaSlicer CLI, writes the result back to
# Firestore and exits. No permanent server.
#
# Backends:
#   Firebase — Authentication + Firestore via Admin SDK (job state only)
#   Supabase — private model storage (STL/3MF download)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT   — full Firebase service-account JSON (contents,
#                                not a path); used by the Firebase Admin SDK
#                                for Firestore job access
#   FIREBASE_PROJECT_ID        — Firebase project ID
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_KEY       — Supabase service key (server-side only)
#
# SUPABASE_BUCKET is NOT a secret — it is passed as a plain value
# (default: custom-prints).

name: Slice Job

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Firestore sliceJobs document ID to process"
        required: true
        type: string

permissions:
  contents: read

env:
  PRUSASLICER_VERSION: "2.9.6"

jobs:
  slice:
    name: Slice model (PrusaSlicer headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # Defense in depth: never let an unvalidated jobId reach a shell or the
      # filesystem (the worker joins TEMP_DIR + jobId). The value is passed to
      # every step via env, never interpolated into shell commands.
      - name: Validate jobId
        env:
          JOB_ID: ${{ inputs.jobId }}
        run: |
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9._-]{1,150}$ ]] || [[ "$JOB_ID" == *".."* ]]; then
            echo "::error::jobId contains unsupported characters"
            exit 1
          fi

      # Community AppImage build (Prusa stopped shipping official Linux
      # AppImages after 2.8.1). Extracted with --appimage-extract so no FUSE is
      # needed on the runner. Cached between runs.
      - name: Cache PrusaSlicer
        id: prusaslicer_cache
        uses: actions/cache@v4
        with:
          path: ~/prusaslicer-appimage
          key: prusaslicer-${{ env.PRUSASLICER_VERSION }}-x86_64

      - name: Install PrusaSlicer runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libfontconfig1 libxrender1 \
            libdbus-1-3 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-shape0 || true

      - name: Download and extract PrusaSlicer
        if: steps.prusaslicer_cache.outputs.cache-hit != 'true'
        env:
          PRUSASLICER_URL: https://github.com/gneiss15/PrusaSlicer.AppImage/releases/download/${{ env.PRUSASLICER_VERSION }}/PrusaSlicer-${{ env.PRUSASLICER_VERSION }}-x86_64_GN.AppImage
        run: |
          rm -rf "$HOME/prusaslicer-appimage"
          mkdir -p "$HOME/prusaslicer-appimage"
          curl -fL --retry 3 -o /tmp/prusaslicer.AppImage "$PRUSASLICER_URL"
          chmod +x /tmp/prusaslicer.AppImage
          (cd "$HOME/prusaslicer-appimage" && "/tmp/prusaslicer.AppImage" --appimage-extract > /dev/null)
          rm -f /tmp/prusaslicer.AppImage

      # TEMPORARY DIAGNOSTICS (to be reverted once fixed). Layout is known:
      # squashfs-root/bin/prusa-slicer (~270 KB) and squashfs-root/shared/bin/
      # prusa-slicer (~99 MB); both fail --version today. For BOTH candidates
      # this step prints ls -lh / file / ELF interpreter / ldd (with an
      # explicit MISSING LIBRARIES callout), runs <candidate> --version,
      # AppRun --version and APPDIR / LD_LIBRARY_PATH variants — always with
      # stdout and stderr captured separately plus exit codes — and prints
      # the file types of AppRun/sharun/lib4bin. Only non-secret environment
      # variables are printed. Selection logic is unchanged: a candidate must
      # really pass --version; otherwise the job fails after printing all
      # diagnostics.
      - name: Expose PrusaSlicer on PATH
        run: |
          ROOT="$HOME/prusaslicer-appimage/squashfs-root"
          if [ ! -d "$ROOT" ]; then
            echo "::error::Extraction directory not found: $ROOT"
            ls -la "$HOME/prusaslicer-appimage" || true
            exit 1
          fi

          run_sep() {
            local LABEL="$1"; shift
            echo "--- RUN [$LABEL]: $* ---"
            set +e
            "$@" > /tmp/diag-out.txt 2> /tmp/diag-err.txt
            RC=$?
            set -e
            echo "exit code: $RC"
            echo "----- stdout -----"
            cat /tmp/diag-out.txt
            echo "----- stderr -----"
            cat /tmp/diag-err.txt
            echo "----- end [$LABEL] -----"
          }

          BIN_CAND="$ROOT/bin/prusa-slicer"
          SHARED_CAND="$ROOT/shared/bin/prusa-slicer"

          echo "############################################################"
          echo "# 1+2. CANDIDATES: existence + file/ls/readelf/ldd"
          echo "############################################################"
          for CAND in "$BIN_CAND" "$SHARED_CAND"; do
            echo "============================================================"
            echo "CANDIDATE: $CAND"
            if [ ! -e "$CAND" ]; then
              echo "RESULT: missing"
              continue
            fi
            ls -lh "$CAND"
            file "$CAND"
            echo "--- ELF interpreter ---"
            readelf -l "$CAND" 2>/dev/null | grep -i 'interpreter' || true
            echo "--- ldd ---"
            LDD_OUT="$(ldd "$CAND" 2>&1)" || true
            printf '%s\n' "$LDD_OUT"
            if printf '%s' "$LDD_OUT" | grep -q 'not found'; then
              echo ">>> MISSING LIBRARIES DETECTED for $CAND:"
              printf '%s\n' "$LDD_OUT" | grep 'not found'
            else
              echo "(no missing libraries reported by ldd)"
            fi
          done

          echo "############################################################"
          echo "# 3. DIRECT RUNS: <candidate> --version (stdout/stderr split)"
          echo "############################################################"
          if [ -e "$BIN_CAND" ]; then
            run_sep bin-prusa-slicer "$BIN_CAND" --version
          fi
          if [ -e "$SHARED_CAND" ]; then
            run_sep shared-bin-prusa-slicer "$SHARED_CAND" --version
          fi

          echo "############################################################"
          echo "# 4. APPRUN LAUNCHER"
          echo "############################################################"
          APPRUN="$ROOT/AppRun"
          if [ -e "$APPRUN" ]; then
            run_sep AppRun "$APPRUN" --version
          else
            echo "(AppRun absent)"
          fi

          echo "############################################################"
          echo "# 5. RUNS WITH APPIMAGE ENVIRONMENT (additional probes)"
          echo "############################################################"
          if [ -e "$SHARED_CAND" ]; then
            run_sep shared-with-APPDIR env APPDIR="$ROOT" "$SHARED_CAND" --version
          fi
          if [ -e "$BIN_CAND" ]; then
            run_sep bin-with-APPDIR env APPDIR="$ROOT" "$BIN_CAND" --version
          fi
          if [ -e "$SHARED_CAND" ]; then
            run_sep shared-with-APPDIR-and-LD_LIBRARY_PATH env APPDIR="$ROOT" LD_LIBRARY_PATH="$ROOT/lib:$ROOT/shared/lib" "$SHARED_CAND" --version
          fi

          echo "############################################################"
          echo "# 6. LAUNCHER/RUNTIME HELPERS"
          echo "############################################################"
          for H in "$ROOT/sharun" "$ROOT/lib4bin" "$ROOT/AppRun"; do
            echo "--- $H ---"
            if [ -e "$H" ]; then
              ls -l "$H"
              file "$H"
            else
              echo "(absent)"
            fi
          done

          echo "############################################################"
          echo "# 7. ENVIRONMENT VARIABLES (non-secret only)"
          echo "############################################################"
          for V in APPDIR PATH LD_LIBRARY_PATH XDG_DATA_DIRS XDG_CONFIG_HOME HOME; do
            echo "$V=${!V:-<empty or unset>}"
          done

          echo "############################################################"
          echo "# SELECTION (unchanged logic: must pass --version)"
          echo "############################################################"
          BIN=""
          while IFS= read -r CANDIDATE; do
            if [ -x "$CANDIDATE" ] && "$CANDIDATE" --version > /tmp/prusa-version.txt 2>&1; then
              BIN="$CANDIDATE"
              break
            fi
            echo ">>> candidate failed verification: $CANDIDATE"
          done < <(find "$ROOT" \( -type f -o -type l \) -name 'prusa-slicer*' 2>/dev/null | sort)

          if [ -z "$BIN" ]; then
            echo "::error::No working PrusaSlicer executable found under $ROOT (full diagnostics above)"
            exit 1
          fi

          echo "Discovered PrusaSlicer binary: $BIN"
          cat /tmp/prusa-version.txt
          sudo ln -sf "$BIN" /usr/local/bin/prusaslicer
          prusaslicer --version

      # The worker creates its per-job temp dir inside TEMP_DIR (mkdtemp).
      - name: Prepare temp directory
        run: mkdir -p /tmp/krb-slicer

      # Write the service-account secret to RUNNER_TEMP (auto-cleaned after the
      # job, never logged). The JSON is written verbatim, so multiline
      # private_key values survive exactly as stored.
      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      # One-shot execution: node dist/index.js <jobId> (same entrypoint as the
      # Dockerfile). The worker claims the job atomically in Firestore,
      # downloads the model from private Supabase Storage, slices it, writes
      # results and exits. jobId reaches the process as a quoted argument
      # sourced from the validated JOB_ID env var — no direct shell
      # interpolation of ${{ }}.
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.jobId }}
          SLICER_PATH: prusaslicer
          TEMP_DIR: /tmp/krb-slicer
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: custom-prints
        run: node dist/index.js "$JOB_ID"
