# KRB PrusaSlicer Worker — one-shot slicing job.
#
# Dispatched by the KRB website (GITHUB_SLICER_TOKEN, actions:write) with a
# Firestore `sliceJobs` document ID. The runner is ephemeral: it checks out the
# worker, downloads the model from the private Supabase Storage bucket
# ("custom-prints"), slices it with PrusaSlicer CLI, writes the result back to
# Firestore and exits. No permanent server.
#
# Backends:
#   Firebase — Authentication + Firestore via Admin SDK (job state only)
#   Supabase — private model storage (STL/3MF download)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT   — full Firebase service-account JSON (contents,
#                                not a path); used by the Firebase Admin SDK
#                                for Firestore job access
#   FIREBASE_PROJECT_ID        — Firebase project ID
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_KEY       — Supabase service key (server-side only)
#
# SUPABASE_BUCKET is NOT a secret — it is passed as a plain value
# (default: custom-prints).

name: Slice Job

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Firestore sliceJobs document ID to process"
        required: true
        type: string
      backend:
        description: "Slicing backend (bambu = default; prusa = emergency fallback)"
        required: false
        type: choice
        default: bambu
        options:
          - prusa
          - bambu

permissions:
  contents: read

env:
  PRUSASLICER_VERSION: "2.9.6"

jobs:
  slice:
    name: Slice model (PrusaSlicer headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install worker dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # Defense in depth: never let an unvalidated jobId reach a shell or the
      # filesystem (the worker joins TEMP_DIR + jobId). The value is passed to
      # every step via env, never interpolated into shell commands.
      - name: Validate jobId
        env:
          JOB_ID: ${{ inputs.jobId }}
        run: |
          if ! [[ "$JOB_ID" =~ ^[A-Za-z0-9._-]{1,150}$ ]] || [[ "$JOB_ID" == *".."* ]]; then
            echo "::error::jobId contains unsupported characters"
            exit 1
          fi
          BACKEND="${{ inputs.backend || 'bambu' }}"
          if [ "$BACKEND" != "prusa" ] && [ "$BACKEND" != "bambu" ]; then
            echo "::error::invalid backend '$BACKEND'"
            exit 1
          fi

      # Community AppImage build (Prusa stopped shipping official Linux
      # AppImages after 2.8.1). Extracted with --appimage-extract so no FUSE is
      # needed on the runner. Cached between runs.
      - name: Cache PrusaSlicer
        id: prusaslicer_cache
        uses: actions/cache@v4
        with:
          path: ~/prusaslicer-appimage
          key: prusaslicer-${{ env.PRUSASLICER_VERSION }}-x86_64

      - name: Install PrusaSlicer runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libfontconfig1 libxrender1 \
            libdbus-1-3 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-shape0 || true

      # Additional runtime libs required by the Bambu Studio backend only.
      - name: Install Bambu Studio runtime libraries
        if: inputs.backend == 'bambu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libx11-xcb1 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-0 || true

      # PrusaSlicer aborts at startup ("locale::facet::_S_create_c_locale
      # name not valid") unless a UTF-8 locale it can initialize exists;
      # the runner default is not enough for this build. Generate
      # en_US.UTF-8 explicitly and export it for every later step.
      - name: Generate UTF-8 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          echo "--- available locales ---"
          locale -a || true
          if ! locale -a 2>/dev/null | grep -qi '^en_US\.utf8$'; then
            echo "::error::en_US.utf8 not present after locale-gen"
            exit 1
          fi
          {
            echo "LANG=en_US.UTF-8"
            echo "LC_ALL=en_US.UTF-8"
          } >> "$GITHUB_ENV"

      - name: Download and extract PrusaSlicer
        if: steps.prusaslicer_cache.outputs.cache-hit != 'true'
        env:
          PRUSASLICER_URL: https://github.com/gneiss15/PrusaSlicer.AppImage/releases/download/${{ env.PRUSASLICER_VERSION }}/PrusaSlicer-${{ env.PRUSASLICER_VERSION }}-x86_64_GN.AppImage
        run: |
          rm -rf "$HOME/prusaslicer-appimage"
          mkdir -p "$HOME/prusaslicer-appimage"
          curl -fL --retry 3 -o /tmp/prusaslicer.AppImage "$PRUSASLICER_URL"
          chmod +x /tmp/prusaslicer.AppImage
          (cd "$HOME/prusaslicer-appimage" && "/tmp/prusaslicer.AppImage" --appimage-extract > /dev/null)
          rm -f /tmp/prusaslicer.AppImage

      # The community GN AppImage uses a Sharun layout: bin/prusa-slicer is
      # only a static launcher stub, and shared/bin/prusa-slicer cannot run
      # standalone (missing bundled libs without the launcher's environment;
      # forcing LD_LIBRARY_PATH breaks C++ locale init). The proven entrypoint
      # is the AppRun Sharun launcher, which sets up its own runtime. It is
      # validated with --help (PrusaSlicer 2.9.6 has no --version) and then
      # exposed as `prusaslicer` for the worker
      # (SLICER_PATH=/usr/local/bin/prusaslicer).
      # LANG/LC_ALL=en_US.UTF-8 are provided by the "Generate UTF-8 locale"
      # step; no library paths are forced manually.
      - name: Expose PrusaSlicer on PATH
        run: |
          ROOT="$HOME/prusaslicer-appimage/squashfs-root"
          APPRUN="$ROOT/AppRun"
          if [ ! -d "$ROOT" ]; then
            echo "::error::Extraction directory not found: $ROOT"
            ls -la "$HOME/prusaslicer-appimage" || true
            exit 1
          fi
          if [ ! -x "$APPRUN" ]; then
            echo "::error::AppRun launcher not found or not executable: $APPRUN"
            ls -la "$ROOT" || true
            exit 1
          fi

          echo "--- validating PrusaSlicer via AppRun launcher ---"
          set +e
          "$APPRUN" --help > /tmp/prusa-help.txt 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::PrusaSlicer --help validation failed (exit code $RC)"
            cat /tmp/prusa-help.txt || true
            exit 1
          fi
          head -n 3 /tmp/prusa-help.txt

          sudo ln -sf "$APPRUN" /usr/local/bin/prusaslicer
          prusaslicer --help > /dev/null

      # ---- Bambu Studio backend (only when explicitly selected) ----
      # Pinned v02.08.02.61, cached by exact version, verified before use.
      - name: Cache pinned Bambu Studio AppImage
        id: bambu_cache
        if: inputs.backend == 'bambu'
        uses: actions/cache@v4
        with:
          path: /home/runner/bambu-studio
          key: bambu-studio-v02.08.02.61-ubuntu24.04-x64

      - name: Download pinned Bambu Studio (cache miss only)
        if: inputs.backend == 'bambu' && steps.bambu_cache.outputs.cache-hit != 'true'
        run: |
          BS_HOME="$HOME/bambu-studio"
          mkdir -p "$BS_HOME"
          curl -fL --retry 3 -o "$BS_HOME/bs.AppImage" "https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage"
          chmod +x "$BS_HOME/bs.AppImage"
          (cd "$BS_HOME" && ./bs.AppImage --appimage-extract > /dev/null)

      - name: Verify cached Bambu Studio (repair on corruption)
        if: inputs.backend == 'bambu'
        run: |
          set +e
          BS_HOME="$HOME/bambu-studio"
          OK=1
          [ -f "$BS_HOME/bs.AppImage" ] || OK=0
          [ -x "$BS_HOME/squashfs-root/AppRun" ] || OK=0
          if [ "$OK" = "1" ]; then
            sudo ln -sf "$BS_HOME/squashfs-root/AppRun" /usr/local/bin/bambu-studio
            bambu-studio --help > /dev/null 2>&1 || OK=0
          fi
          if [ "$OK" != "1" ]; then
            echo "::warning::Bambu cache missing or corrupt — re-downloading pinned v02.08.02.61"
            rm -rf "$BS_HOME"
            mkdir -p "$BS_HOME"
            curl -fL --retry 3 -o "$BS_HOME/bs.AppImage" "https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage" || exit 1
            chmod +x "$BS_HOME/bs.AppImage"
            (cd "$BS_HOME" && ./bs.AppImage --appimage-extract > /dev/null) || exit 1
            sudo ln -sf "$BS_HOME/squashfs-root/AppRun" /usr/local/bin/bambu-studio
            bambu-studio --help > /dev/null 2>&1 || { echo "::error::re-downloaded Bambu still broken"; exit 1; }
          fi
          echo "verified pinned Bambu Studio v02.08.02.61"

      # ---- End Bambu backend steps ----

      # The worker creates its per-job temp dir inside TEMP_DIR (mkdtemp).
      - name: Prepare temp directory
        run: mkdir -p /tmp/krb-slicer

      # Write the service-account secret to RUNNER_TEMP (auto-cleaned after the
      # job, never logged). The JSON is written verbatim, so multiline
      # private_key values survive exactly as stored.
      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      # One-shot execution: node dist/index.js <jobId> (same entrypoint as the
      # Dockerfile). The worker claims the job atomically in Firestore,
      # downloads the model from private Supabase Storage, slices it, writes
      # results and exits. jobId reaches the process as a quoted argument
      # sourced from the validated JOB_ID env var — no direct shell
      # interpolation of ${{ }}.
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.jobId }}
          SLICER_BACKEND: ${{ inputs.backend || 'bambu' }}
          SLICER_PATH: ${{ (inputs.backend == 'bambu') && '/usr/local/bin/bambu-studio' || '/usr/local/bin/prusaslicer' }}
          TEMP_DIR: /tmp/krb-slicer
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: custom-prints
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: node dist/index.js "$JOB_ID"
