# krb-printing-slicer ??? KRB A1 Standard (PLA) PrusaSlicer profile
#
# Represents a Bambu Lab A1, 0.4 mm nozzle, PLA, "Standard" (0.20 mm) quality.
#
# Source of truth (official Bambu Studio profile repository):
#   bambulab/BambuStudio @ master, resources/profiles/BBL/
#     machine/Bambu Lab A1 0.4 nozzle.json   -> inherits fdm_bbl_3dp_001_common
#     process/0.20mm Standard @BBL A1.json   -> inherits fdm_process_single_0.20
#                                             -> fdm_process_single_common
#                                             -> fdm_process_common
#     filament/Bambu PLA Basic @BBL A1.json  -> inherits Bambu PLA Basic @base
#                                             -> fdm_filament_pla
#
# Only parameters with verified PrusaSlicer 2.9.6 equivalents are mapped
# (key existence verified against version_2.9.6/src/libslic3r/PrintConfig.cpp).
# Bambu key -> PrusaSlicer key mappings are annotated inline.


; --- geometry / shells (process common + single_0.20) ---
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
fill_density = 15%
fill_pattern = grid
top_solid_layers = 5
bottom_solid_layers = 3

; --- speeds (Bambu *_speed -> PrusaSlicer equivalents) ---
external_perimeter_speed = 200
perimeter_speed = 300
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
support_material_speed = 150
support_material_interface_speed = 80
first_layer_speed = 50
first_layer_infill_speed = 105
bridge_speed = 50
gap_fill_speed = 250
small_perimeter_speed = 50%
; travel_speed: A1 process declares 700 mm/s but the A1 machine limit is
; 500 mm/s (machine_max_speed_x/y); Bambu Studio applies machine limits to its
; time estimate, so the effective value is 500.
travel_speed = 500

; --- acceleration (Bambu *_acceleration -> PrusaSlicer equivalents) ---
default_acceleration = 6000
external_perimeter_acceleration = 5000
perimeter_acceleration = 6000
infill_acceleration = 6000
solid_infill_acceleration = 6000
top_solid_infill_acceleration = 2000
first_layer_acceleration = 500
travel_acceleration = 10000

; --- extrusion widths (Bambu line widths, fdm_process_common) ---
extrusion_width = 0.42
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.42

; --- supports (KRB Standard enables auto supports; params from Bambu process) ---
support_material = 1
support_material_auto = 1
support_material_style = tree
support_material_threshold = 30
support_material_xy_spacing = 0.35
support_material_contact_distance = 0.2
support_material_interface_layers = 2
support_material_spacing = 2.5
support_material_extrusion_width = 0.42

; --- misc process (A1 process/common) ---
elefant_foot_compensation = 0.075
seam_position = aligned
brim_width = 5
skirts = 0
infill_overlap = 15%
bridge_flow_ratio = 1


; --- temperatures (Bambu PLA Basic @base/@A1) ---
temperature = 220
first_layer_temperature = 220
bed_temperature = 65
first_layer_bed_temperature = 65
filament_type = PLA

; --- material properties affecting weight/time estimates ---
filament_density = 1.24
filament_max_volumetric_speed = 12
extrusion_multiplier = 0.98

; --- cooling (fdm_filament_pla + @A1 overrides) ---
min_fan_speed = 60
max_fan_speed = 80
fan_below_layer_time = 80
slowdown_below_layer_time = 8
min_print_speed = 20
disable_fan_first_layers = 1


; --- machine limits, time-estimate only (A1 machine overrides of fdm_bbl_3dp_001_common) ---
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 12000
machine_max_acceleration_y = 12000
machine_max_acceleration_z = 1500
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 12000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 9000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 30
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 3
machine_max_jerk_e = 3

; --- printer geometry (A1 machine json) ---
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4

; --- retraction (fdm_bbl_3dp_001_common machine values; direct drive) ---
retract_length = 0.8
retract_speed = 30
deretract_speed = 30
retract_before_travel = 1
retract_lift = 0
